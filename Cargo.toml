[package]
name = "zotan-rs"
version = "0.1.0"
edition = "2024"  # Rust 2024 edition
description = "Zotan AI Agent Framework"

[dependencies]
anyhow = "1.0"
bytes = "1.11"
clap = { version = "4.6", features = ["derive", "env"] }
dirs = "6.0"
either = { version = "1.15", features = ["serde"] }
futures = "0.3"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive", "rc"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }
toml_edit = { version = "0.25", features = ["serde"] }
users = "0.11"

[dev-dependencies]
tempfile = "3.0"

[[bin]]
name = "zotan-rs"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
